  // =====================================================================
  // HELPERS
  // =====================================================================
  // Compact createElement wrapper: el("div", { className:"x" }, [child1, child2, "text"])
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null) continue;
        if (k === "className")      node.className = v;
        else if (k === "textContent") node.textContent = v;
        else if (k === "style" && typeof v === "object") {
          for (var sk in v) if (Object.prototype.hasOwnProperty.call(v, sk)) node.style[sk] = v[sk];
        }
        else if (k.indexOf("on") === 0 && typeof v === "function") node[k] = v;
        else if (k === "dataset") {
          for (var dk in v) if (Object.prototype.hasOwnProperty.call(v, dk)) node.dataset[dk] = v[dk];
        }
        else node.setAttribute(k, v);
      }
    }
    if (children) {
      if (!Array.isArray(children)) children = [children];
      for (var i = 0; i < children.length; i++) {
        var c = children[i];
        if (c == null || c === false) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
    }
    return node;
  }

  // Inline SVG via DOMParser — safer than innerHTML inside the script
  // because CKEditor never sees the SVG markup; it lives only in a string
  // assigned to a JS variable.
  function svgIcon(svgString) {
    var doc = new DOMParser().parseFromString(svgString, "image/svg+xml");
    var svg = doc.documentElement;
    return document.importNode(svg, true);
  }
  var SVG_CLOSE = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var SVG_PREV  = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  var SVG_NEXT  = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  function slugify(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }
  function isVideo(url) {
    return /\.(mp4|mov|webm|m4v|ogg)(\?|#|$)/i.test(url)
        || /youtube\.com|youtu\.be|vimeo\.com/i.test(url);
  }
  function cellToText(cell) {
    if (!cell) return "";
    var clone = cell.cloneNode(true);
    var brs = clone.querySelectorAll("br");
    for (var i = 0; i < brs.length; i++) {
      brs[i].parentNode.replaceChild(document.createTextNode("\n"), brs[i]);
    }
    return (clone.textContent || "").trim();
  }
  function parseGvizHTML(text) {
    var doc;
    try { doc = new DOMParser().parseFromString(text, "text/html"); }
    catch (e) { return []; }
    var table = doc.querySelector("table");
    if (!table || !table.rows.length) return [];
    var trs = table.rows;
    var headers = [];
    for (var h = 0; h < trs[0].cells.length; h++) {
      headers.push((trs[0].cells[h].textContent || "").trim());
    }
    var out = [];
    for (var i = 1; i < trs.length; i++) {
      var cells = trs[i].cells, obj = {}, hasContent = false;
      for (var j = 0; j < headers.length; j++) {
        var name = headers[j], cell = cells[j];
        obj[name] = cell ? cellToText(cell) : "";
        if (obj[name]) hasContent = true;
      }
      if (hasContent) out.push(obj);
    }
    return out;
  }
  function hashCSV(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h.toString(16);
  }
  function parseStoriesSheet(rows) {
    return (rows || [])
      .filter(function (r) {
        var flag = String(r["IsActive"] || "").trim().toLowerCase();
        return flag === "" || flag === "show" || flag === "true" || flag === "yes" || flag === "1";
      })
      .map(function (r) {
        var urls = String(r["Media Links"] || "")
          .split(/[\r\n,]+/)
          .map(function (s) { return s.trim(); })
          .filter(function (s) { return /^https?:\/\//i.test(s); });
        var caption = r["Captions"] || "";
        var assets = urls.map(function (u) {
          return { type: isVideo(u) ? "video" : "image", src: u, caption: caption };
        });
        var firstImage = null;
        for (var i = 0; i < urls.length; i++) {
          if (!isVideo(urls[i])) { firstImage = urls[i]; break; }
        }
        return {
          id: slugify(caption) || slugify(r["GroupTitle"]),
          title: caption,
          eyebrow: r["GroupTitle"] || "",
          cover: firstImage || urls[0] || "",
          assets: assets
        };
      })
      .filter(function (s) { return s.assets.length > 0; });
  }

  // =====================================================================
  // SWR CACHE
  // =====================================================================
  var lastFetchAt = 0;
  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && obj.v === 1 && Array.isArray(obj.rows)) ? obj : null;
    } catch (e) { return null; }
  }
  function writeCache(rows, hash) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v:1, t:Date.now(), hash:hash, rows:rows })); }
    catch (e) {}
  }
  function fetchLive() {
    var url = SHEET_SRC + "&_=" + Date.now();
    return fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        lastFetchAt = Date.now();
        return { hash: hashCSV(txt), rows: parseGvizHTML(txt) };
      });
  }
  function loadSWR(onData) {
    var cached = readCache();
    if (cached && cached.rows.length) onData(cached.rows);
    else onData(MOCK);
    return fetchLive().then(function (fresh) {
      if (!fresh.rows.length) return;
      if (!cached || cached.hash !== fresh.hash) {
        onData(fresh.rows);
        writeCache(fresh.rows, fresh.hash);
      }
    }).catch(function () { /* keep mock/cache painted */ });
  }
  function attachFocusRevalidate(onData) {
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible") return;
      if (Date.now() - lastFetchAt < REVALIDATE_MIN_GAP) return;
      fetchLive().then(function (fresh) {
        if (!fresh.rows.length) return;
        var cached = readCache();
        if (!cached || cached.hash !== fresh.hash) {
          onData(fresh.rows);
          writeCache(fresh.rows, fresh.hash);
        }
      }).catch(function () {});
    });
  }

  // =====================================================================
  // BUILD SECTION (strip)
  // =====================================================================
  function buildSection() {
    var root = document.getElementById("fdcp-home-stories-root");
    if (!root) {
      // Drupal/CKEditor sometimes strips empty mount divs. Recreate it next
      // to the current script tag (or fall back to body) so we still render.
      root = document.createElement("div");
      root.id = "fdcp-home-stories-root";
      var scripts = document.getElementsByTagName("script");
      var here = scripts[scripts.length - 1];
      if (here && here.parentNode) here.parentNode.insertBefore(root, here);
      else document.body.appendChild(root);
    }
    root.textContent = ""; // clear the &nbsp; placeholder

    trackEl = el("div", {
      id: "fdcp-home-stories-track",
      role: "list",
      "aria-label": "Event stories"
    });

    var shell = el("div", { className: "fdcp-home-stories-shell" }, [trackEl]);
    var wrap  = el("div", { className: "fdcp-home-stories-wrap" }, [shell]);

    root.appendChild(wrap);
  }

  function renderStoryCards() {
    if (!trackEl) return;
    trackEl.textContent = ""; // clear
    STORIES.forEach(function (s, i) {
      var n = (s.assets || []).length;

      var cover = el("img", { className: "fdcp-home-story-cover", src: s.cover || "", alt: "", loading: "lazy" });
      var scrim = el("div", { className: "fdcp-home-story-scrim" });
      var ring  = el("span", { className: "fdcp-home-story-ring", textContent: s.eyebrow || "Story" });
      var meta  = el("span", { className: "fdcp-home-story-meta", textContent: n + " " + (n === 1 ? "item" : "items") });
      var title = el("span", { className: "fdcp-home-story-title", textContent: s.title || "" });

      var card = el("button", {
        type: "button",
        className: "fdcp-home-story-card",
        "aria-label": "Open story: " + (s.title || "") + " (" + n + " items)",
        dataset: { storyIndex: String(i) }
      }, [cover, scrim, ring, meta, title]);

      card.addEventListener("click", function () { openFocus(i, 0); });

      trackEl.appendChild(card);
    });

    enableDragScroll(trackEl);
    runEntranceAnimation(trackEl);
  }

  // Click-and-drag horizontal scroll
  function enableDragScroll(track) {
    if (!track || track.__fdcpDragBound) return;
    track.__fdcpDragBound = true;
    var DRAG_THRESHOLD = 8;
    var isDown = false, didDrag = false, startX = 0, startScroll = 0, prevUserSelect = "";
    track.style.cursor = "grab";
    track.style.touchAction = "auto";

    function onMove(e) {
      if (!isDown) return;
      var dx = e.clientX - startX;
      if (!didDrag) {
        if (Math.abs(dx) <= DRAG_THRESHOLD) return;
        didDrag = true;
        track.classList.add("is-dragging");
        track.style.cursor = "grabbing";
      }
      e.preventDefault();
      track.scrollLeft = startScroll - dx;
    }
    function onUp() {
      if (!isDown) return;
      isDown = false;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      track.classList.remove("is-dragging");
      track.style.cursor = "grab";
      document.body.style.userSelect = prevUserSelect;
      if (didDrag) setTimeout(function () { didDrag = false; }, 0);
    }
    track.addEventListener("pointerdown", function (e) {
      if (e.pointerType !== "mouse") return;
      isDown = true; didDrag = false;
      startX = e.clientX; startScroll = track.scrollLeft;
      prevUserSelect = document.body.style.userSelect;
      document.body.style.userSelect = "none";
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
    track.addEventListener("click", function (e) {
      if (didDrag) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  }

  // =====================================================================
  // BUILD MODAL (focus viewer)
  // =====================================================================
  function buildModal() {
    if (modalEl) return;

    refs.close   = el("button", { type: "button", className: "fdcp-home-focus-top-close", "aria-label": "Close stories" }, [svgIcon(SVG_CLOSE)]);

    refs.list    = el("div", { id: "fdcp-home-focus-story-list", className: "fdcp-home-focus-story-list", role: "list" });
    var sidebar  = el("aside", { className: "fdcp-home-focus-sidebar" }, [
      el("h3", { className: "fdcp-home-focus-sidebar-title", textContent: "FDCP Stories" }),
      refs.list
    ]);

    refs.arrowPrev = el("button", { type: "button", className: "fdcp-home-focus-arrow", "aria-label": "Previous" }, [svgIcon(SVG_PREV)]);
    refs.arrowNext = el("button", { type: "button", className: "fdcp-home-focus-arrow", "aria-label": "Next"     }, [svgIcon(SVG_NEXT)]);

    refs.progress = el("div", { className: "fdcp-home-focus-progress" });
    refs.title    = el("h4",  { className: "fdcp-home-focus-title", textContent: "" });
    refs.counter  = el("span",{ className: "fdcp-home-focus-counter", textContent: "" });
    var header    = el("div", { className: "fdcp-home-focus-header" }, [
      el("div", { className: "fdcp-home-focus-titlewrap" }, [refs.title]),
      refs.counter
    ]);
    refs.viewport = el("div", { className: "fdcp-home-focus-viewport" });
    refs.tapPrev  = el("button", { type: "button", className: "fdcp-home-focus-tap prev", "aria-label": "Previous" });
    refs.tapNext  = el("button", { type: "button", className: "fdcp-home-focus-tap next", "aria-label": "Next" });
    refs.caption  = el("p",   { className: "fdcp-home-focus-caption" });

    var frame = el("div", { className: "fdcp-home-focus-frame" }, [
      refs.progress, header, refs.viewport, refs.tapPrev, refs.tapNext, refs.caption
    ]);

    var stage = el("div", { className: "fdcp-home-focus-stage" }, [refs.arrowPrev, frame, refs.arrowNext]);
    var layout = el("div", { className: "fdcp-home-focus-layout" }, [sidebar, stage]);

    modalEl = el("div", {
      id: "fdcp-home-focus",
      role: "dialog",
      "aria-modal": "true",
      "aria-labelledby": ""
    }, [refs.close, layout]);

    // Wire controls
    refs.close.addEventListener("click", closeFocus);
    refs.tapPrev.addEventListener("click", function () { gotoAsset(-1); });
    refs.tapNext.addEventListener("click", function () { gotoAsset(1); });
    refs.arrowPrev.addEventListener("click", function () { gotoAsset(-1); });
    refs.arrowNext.addEventListener("click", function () { gotoAsset(1); });
    modalEl.addEventListener("click", function (e) { if (e.target === modalEl) closeFocus(); });

    document.body.appendChild(modalEl);
  }

  // =====================================================================
  // RENDER FOCUS VIEWER PIECES
  // =====================================================================
  function renderProgress() {
    var s = activeStory();
    if (!refs.progress || !s) return;
    refs.progress.textContent = "";
    for (var i = 0; i < s.assets.length; i++) {
      var fill = el("span", { className: "fdcp-home-focus-seg-fill" });
      if (i <= FOCUS.assetIndex) fill.style.width = "100%";
      var seg = el("div", { className: "fdcp-home-focus-seg" }, [fill]);
      refs.progress.appendChild(seg);
    }
  }

  function renderStoryList() {
    if (!refs.list) return;
    refs.list.textContent = "";
    STORIES.forEach(function (s, i) {
      var active = i === FOCUS.storyIndex;
      var n = (s.assets || []).length;

      var thumb = el("img", {
        className: "fdcp-home-focus-story-thumb",
        src: s.cover || "", alt: "", loading: "lazy"
      });
      thumb.style.borderColor = active ? "#E200A9" : "transparent";

      var name = el("span", { className: "fdcp-home-focus-story-name", textContent: s.title || "" });
      var metaSpan = el("span", { className: "fdcp-home-focus-story-meta", textContent: n + " " + (n === 1 ? "item" : "items") });
      var info = el("span", { className: "fdcp-home-focus-story-info" }, [name, metaSpan]);

      var btn = el("button", {
        type: "button",
        className: "fdcp-home-focus-story-item" + (active ? " is-active" : ""),
        dataset: { storyJump: String(i) }
      }, [thumb, info]);

      btn.addEventListener("click", function () {
        if (i === FOCUS.storyIndex) return;
        FOCUS.storyIndex = i;
        FOCUS.assetIndex = 0;
        renderStoryList(); renderProgress(); renderHeader(); renderMedia();
      });

      refs.list.appendChild(btn);
    });
  }

  function renderHeader() {
    var s = activeStory();
    if (!s) return;
    if (refs.title)   refs.title.textContent   = s.title || "";
    if (refs.counter) refs.counter.textContent = (FOCUS.assetIndex + 1) + " of " + s.assets.length;
  }

  function renderMedia() {
    var asset = activeAsset();
    if (!refs.viewport || !asset) return;
    refs.viewport.textContent = "";
    var mediaEl;
    if (asset.type === "video") {
      mediaEl = document.createElement("video");
      mediaEl.src = asset.src;
      mediaEl.controls = true;
      mediaEl.autoplay = true;
      mediaEl.playsInline = true;
      mediaEl.setAttribute("playsinline", "");
    } else {
      mediaEl = document.createElement("img");
      mediaEl.src = asset.src;
      mediaEl.alt = asset.caption || (activeStory() && activeStory().title) || "";
    }
    mediaEl.className = "fdcp-home-focus-media";
    refs.viewport.appendChild(mediaEl);
    if (refs.caption) refs.caption.textContent = asset.caption || "";
    syncArrowState();
  }

  function syncArrowState() {
    var s = activeStory();
    if (!s) return;
    var canPrev = FOCUS.assetIndex > 0 || FOCUS.storyIndex > 0;
    var canNext = FOCUS.assetIndex < s.assets.length - 1 || FOCUS.storyIndex < STORIES.length - 1;
    if (refs.arrowPrev) { refs.arrowPrev.disabled = !canPrev; refs.arrowPrev.style.opacity = canPrev ? "1" : "0.25"; }
    if (refs.arrowNext) { refs.arrowNext.disabled = !canNext; refs.arrowNext.style.opacity = canNext ? "1" : "0.25"; }
  }

  function gotoAsset(delta) {
    var s = activeStory();
    if (!s) return;
    var ni = FOCUS.assetIndex + delta;
    if (ni < 0) {
      if (FOCUS.storyIndex > 0) {
        FOCUS.storyIndex -= 1;
        FOCUS.assetIndex = STORIES[FOCUS.storyIndex].assets.length - 1;
      } else return;
    } else if (ni >= s.assets.length) {
      if (FOCUS.storyIndex < STORIES.length - 1) {
        FOCUS.storyIndex += 1;
        FOCUS.assetIndex = 0;
      } else return;
    } else {
      FOCUS.assetIndex = ni;
    }
    renderStoryList(); renderProgress(); renderHeader(); renderMedia();
  }

  function openFocus(storyIndex, assetIndex) {
    if (storyIndex < 0 || storyIndex >= STORIES.length) return;
    buildModal();
    FOCUS.storyIndex = storyIndex;
    FOCUS.assetIndex = assetIndex || 0;
    FOCUS.lastFocus = document.activeElement;

    modalEl.classList.add("is-open");
    modalEl.style.display = "flex";
    document.body.style.overflow = "hidden";

    renderStoryList(); renderProgress(); renderHeader(); renderMedia();
    if (refs.close) refs.close.focus();

    FOCUS.keyHandler = function (e) {
      if (e.key === "Escape")    { e.preventDefault(); closeFocus(); }
      if (e.key === "ArrowRight"){ e.preventDefault(); gotoAsset(1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); gotoAsset(-1); }
    };
    document.addEventListener("keydown", FOCUS.keyHandler);
  }

  function closeFocus() {
    if (!modalEl) return;
    modalEl.classList.remove("is-open");
    modalEl.style.display = "none";
    document.body.style.overflow = "";
    if (refs.viewport) {
      var v = refs.viewport.querySelector("video");
      if (v) { try { v.pause(); } catch (e) {} }
      refs.viewport.textContent = "";
    }
    if (FOCUS.keyHandler) {
      document.removeEventListener("keydown", FOCUS.keyHandler);
      FOCUS.keyHandler = null;
    }
    if (FOCUS.lastFocus && typeof FOCUS.lastFocus.focus === "function") {
      try { FOCUS.lastFocus.focus(); } catch (e) {}
    }
  }

  // =====================================================================
  // GSAP ENTRANCE (optional, no-op if GSAP isn't on the page)
  // =====================================================================
  function runEntranceAnimation(track) {
    if (cardsAnimated) return;
    if (typeof gsap === "undefined" || typeof ScrollTrigger === "undefined") return;
    cardsAnimated = true;
    gsap.registerPlugin(ScrollTrigger);
    var cards = Array.prototype.slice.call(track.querySelectorAll(".fdcp-home-story-card"));
    if (!cards.length) return;
    gsap.set(cards, { y: 40, opacity: 0 });
    gsap.to(cards, {
      y: 0, opacity: 1, duration: 0.55, stagger: 0.08, ease: "power2.out",
      scrollTrigger: { trigger: track, start: "top 85%", once: true }
    });
  }

  // =====================================================================
  // INIT
  // =====================================================================
  function init() {
    injectStyles();
    buildSection();
    STORIES = parseStoriesSheet(STORIES_SHEET);
    if (!STORIES.length) return;
    renderStoryCards();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
