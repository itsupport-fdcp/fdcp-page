    function injectStyles() {
      if (document.getElementById("fdcp-home-stories-styles")) return;
      var s = document.createElement("style");
      s.id = "fdcp-home-stories-styles";
      s.textContent = CSS;
      document.head.appendChild(s);
    }

    // =====================================================================
    // STORIES DATA
    // Live feed from the "FDCP STORIES" tab, matching gallery.html.
    // =====================================================================
    // =====================================================================
    // HELPERS
    // =====================================================================
    // Compact createElement wrapper: el("div", { className:"x" }, [child1, child2, "text"])
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        for (var k in attrs) {
          if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
          var v = attrs[k];
          if (v == null) continue;
          if (k === "className")      node.className = v;
          else if (k === "textContent") node.textContent = v;
          else if (k === "style" && typeof v === "object") {
            for (var sk in v) if (Object.prototype.hasOwnProperty.call(v, sk)) node.style[sk] = v[sk];
          }
          else if (k.indexOf("on") === 0 && typeof v === "function") node[k] = v;
          else if (k === "dataset") {
            for (var dk in v) if (Object.prototype.hasOwnProperty.call(v, dk)) node.dataset[dk] = v[dk];
          }
          else node.setAttribute(k, v);
        }
      }
      if (children) {
        if (!Array.isArray(children)) children = [children];
        for (var i = 0; i < children.length; i++) {
          var c = children[i];
          if (c == null || c === false) continue;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
      }
      return node;
    }

    // Inline SVG via DOMParser — safer than innerHTML inside the script
    // because CKEditor never sees the SVG markup; it lives only in a string
    // assigned to a JS variable.
    function svgIcon(svgString) {
      var doc = new DOMParser().parseFromString(svgString, "image/svg+xml");
      var svg = doc.documentElement;
      return document.importNode(svg, true);
    }
    var SVG_CLOSE = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    var SVG_PREV  = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
    var SVG_NEXT  = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
    var SVG_ARROW = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

    function slugify(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    }
    function isVideo(url) {
      return /\.(mp4|mov|webm|m4v|ogg|m3u8)(\?|#|$)/i.test(url)
          || /youtube\.com|youtu\.be|vimeo\.com/i.test(url);
    }
    function isHls(url) {
      return /\.m3u8(\?|#|$)/i.test(String(url || ""));
    }
    // Extracts the 11-char video id from any YouTube URL form, including
    // Shorts (youtube.com/shorts/ID), watch?v=ID, youtu.be/ID and /embed/ID.
    function youTubeId(url) {
      var m = String(url || "").match(
        /(?:youtube\.com\/(?:shorts\/|embed\/|live\/|watch\?(?:.*&)?v=)|youtu\.be\/)([\w-]{11})/i
      );
      return m ? m[1] : "";
    }
    function cellToText(cell) {
      if (!cell) return "";
      var clone = cell.cloneNode(true);
      var brs = clone.querySelectorAll("br");
      for (var i = 0; i < brs.length; i++) {
        brs[i].parentNode.replaceChild(document.createTextNode("\n"), brs[i]);
      }
      return (clone.textContent || "").trim();
    }
    function parseStoriesGviz(text) {
      var doc;
      try { doc = new DOMParser().parseFromString(text, "text/html"); }
      catch (e) { return []; }
      var table = doc.querySelector("table");
      if (!table || !table.rows.length) return [];
      var trs = table.rows;

      var headerIdx = -1;
      for (var r = 0; r < trs.length; r++) {
        for (var c = 0; c < trs[r].cells.length; c++) {
          if ((trs[r].cells[c].textContent || "").trim()) { headerIdx = r; break; }
        }
        if (headerIdx >= 0) break;
      }
      if (headerIdx < 0) return [];

      var headers = [];
      for (var h = 0; h < trs[headerIdx].cells.length; h++) {
        headers.push((trs[headerIdx].cells[h].textContent || "").replace(/ /g, " ").trim().replace(/\s+/g, " ").toLowerCase());
      }
      function findIdx() {
        for (var k = 0; k < headers.length; k++) {
          for (var m = 0; m < arguments.length; m++) {
            if (headers[k].indexOf(arguments[m]) >= 0) return k;
          }
        }
        return -1;
      }
      var iCategory = findIdx("category", "group");
      var iCaption  = findIdx("caption");
      var iPhoto    = findIdx("photo link");
      var iVideo    = findIdx("video link", "youtube");
      var iActive   = findIdx("isactive", "show/hide", "show / hide");

      function cellText(row, idx) {
        if (idx < 0 || !row.cells[idx]) return "";
        return cellToText(row.cells[idx]).replace(/ /g, " ").trim();
      }

      var out = [];
      for (var i = headerIdx + 1; i < trs.length; i++) {
        var grp   = cellText(trs[i], iCategory);
        var cap   = cellText(trs[i], iCaption);
        var photo = cellText(trs[i], iPhoto);
        var vid   = cellText(trs[i], iVideo);
        var act   = cellText(trs[i], iActive);
        var media = [photo, vid].filter(Boolean).join("\n");
        if (!grp && !cap && !media) continue;
        out.push({
          "GroupTitle":  grp,
          "Captions":    cap,
          "Media Links": media,
          "IsActive":    act
        });
      }
      return out;
    }
    function hashCSV(s) {
      var h = 0x811c9dc5;
      for (var i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      return h.toString(16);
    }
    function parseStoriesSheet(rows) {
      return (rows || [])
        .filter(function (r) {
          var flag = String(r["IsActive"] || "").trim().toLowerCase();
          return flag === "" || flag === "show" || flag === "true" || flag === "yes" || flag === "1";
        })
        .map(function (r) {
          var urls = String(r["Media Links"] || "")
            .split(/[\r\n,]+/)
            .map(function (s) { return s.trim(); })
            .filter(function (s) { return /^https?:\/\//i.test(s); });
          var caption = r["Captions"] || "";
          function toAsset(u) {
            var driveFolder = u.match(/drive\.google\.com\/drive\/folders\/([\w-]+)/i);
            if (driveFolder) {
              return {
                type: "iframe",
                src: "https://drive.google.com/embeddedfolderview?id=" + driveFolder[1] + "#grid",
                thumb: "",
                caption: caption
              };
            }
            var driveFile = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/i);
            if (driveFile) {
              // Drive's direct-download URL won't stream reliably in <video>
              // (large files hit a virus-scan page), so use the /preview iframe.
              // It can't auto-advance (cross-origin, no end event) and its
              // controls can't be hidden — accepted tradeoff. When story videos
              // move to direct .mp4 (S3) links, isVideo() below catches them and
              // they render as a native <video> with exact auto-advance — no
              // code change needed.
              return {
                type: "iframe",
                src: "https://drive.google.com/file/d/" + driveFile[1] + "/preview",
                thumb: "https://drive.google.com/thumbnail?id=" + driveFile[1] + "&sz=w1600",
                caption: caption
              };
            }
            var ytId = youTubeId(u);
            if (ytId) {
              // YouTube (incl. Shorts) → embed iframe. renderMedia() appends the
              // autoplay/playsinline params for youtube.com/embed/ srcs. The
              // hqdefault thumbnail drives the card cover + sidebar circle.
              return {
                type: "iframe",
                src: "https://www.youtube.com/embed/" + ytId,
                thumb: "https://img.youtube.com/vi/" + ytId + "/hqdefault.jpg",
                caption: caption
              };
            }
            return {
              type: isVideo(u) ? "video" : "image",
              src: u,
              thumb: isVideo(u) ? "" : u,
              caption: caption
            };
          }
          var assets = urls.map(toAsset);
          var cover = "";
          var coverVideo = "";   // S3/native video used as the card cover (first frame)
          for (var i = 0; i < assets.length; i++) {
            if (assets[i].thumb) { cover = assets[i].thumb; break; }
          }
          // No image thumbnail anywhere (e.g. single S3 .mp4 story) — fall back
          // to the first native video so the card shows its first frame. HLS
          // (.m3u8) is excluded: it won't render in a bare <video> off Safari,
          // and loading hls.js just for a static thumbnail isn't worth it.
          if (!cover) {
            for (var j = 0; j < assets.length; j++) {
              if (assets[j].type === "video" && assets[j].src && !isHls(assets[j].src)) {
                coverVideo = assets[j].src; break;
              }
            }
          }
          return {
            id: slugify(caption) || slugify(r["GroupTitle"]),
            title: caption,
            eyebrow: r["GroupTitle"] || "",
            // Card cover is a compressed (~600px) variant of the thumbnail for
            // fast strip loading; the fullscreen viewer still uses asset.thumb
            // (~1600px) so the story image stays sharp.
            cover: compressDriveThumb(cover, 600),
            coverVideo: coverVideo,
            assets: assets
          };
        })
        .filter(function (s) { return s.assets.length > 0; });
    }

    // Rewrite a Drive thumbnail URL to a narrower (compressed) width. Returns
    // non-Drive URLs unchanged so externally-hosted covers are untouched.
    function compressDriveThumb(url, width) {
      if (!url) return url;
      return String(url).replace(/([?&]sz=w)\d+/i, "$1" + width);
    }

    function categoryFontSize(label) {
      var len = String(label || "").trim().length;
      if (len > 26) return "7px";
      if (len > 21) return "8px";
      if (len > 16) return "9px";
      return "10px";
    }

    // =====================================================================
    // SWR CACHE
    // =====================================================================
    var lastFetchAt = 0;
    function readCache() {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        return (obj && obj.v === 2 && Array.isArray(obj.rows)) ? obj : null;
      } catch (e) { return null; }
    }
    function writeCache(rows, hash) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v:2, t:Date.now(), hash:hash, rows:rows })); }
      catch (e) {}
    }
    function fetchLive() {
      var url = SHEET_SRC + "&_=" + Date.now();
      return fetch(url, { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (txt) {
          lastFetchAt = Date.now();
          return { hash: hashCSV(txt), rows: parseStoriesGviz(txt) };
        });
    }
    function loadSWR(onData) {
      var cached = readCache();
      if (cached && cached.rows.length) onData(cached.rows);
      return fetchLive().then(function (fresh) {
        if (!fresh.rows.length) return;
        if (!cached || cached.hash !== fresh.hash) {
          onData(fresh.rows);
          writeCache(fresh.rows, fresh.hash);
        }
      }).catch(function () { /* keep cache painted */ });
    }
    function attachFocusRevalidate(onData) {
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        if (Date.now() - lastFetchAt < REVALIDATE_MIN_GAP) return;
        fetchLive().then(function (fresh) {
          if (!fresh.rows.length) return;
          var cached = readCache();
          if (!cached || cached.hash !== fresh.hash) {
            onData(fresh.rows);
            writeCache(fresh.rows, fresh.hash);
          }
        }).catch(function () {});
      });
    }

    // =====================================================================
    // STATE
    // =====================================================================
    var STORIES = [];
    var cardsAnimated = false;
    var FOCUS = { storyIndex: -1, assetIndex: 0, lastFocus: null, keyHandler: null };
    var modalEl = null;          // built once, appended to body
    var trackEl = null;          // strip container
    var refs = {};               // cached DOM refs for the modal

    function activeStory() { return STORIES[FOCUS.storyIndex] || null; }
    function activeAsset() {
      var s = activeStory();
      return s ? (s.assets[FOCUS.assetIndex] || null) : null;
    }

    // =====================================================================
    // BUILD SECTION (strip)
    // =====================================================================
    function buildSection() {
      var root = document.getElementById("fdcp-home-stories-root");
      if (!root) {
        // Drupal/CKEditor sometimes strips empty mount divs. Recreate it next
        // to the current script tag (or fall back to body) so we still render.
        root = document.createElement("div");
        root.id = "fdcp-home-stories-root";
        var scripts = document.getElementsByTagName("script");
        var here = scripts[scripts.length - 1];
        if (here && here.parentNode) here.parentNode.insertBefore(root, here);
        else document.body.appendChild(root);
      }
      root.textContent = ""; // clear the &nbsp; placeholder

      trackEl = el("div", {
        id: "fdcp-home-stories-track",
        role: "list",
        "aria-label": "Event stories"
      });

      var shell = el("div", { className: "fdcp-home-stories-shell" }, [trackEl]);
      var wrap  = el("div", { className: "fdcp-home-stories-wrap" }, [shell]);

      root.appendChild(wrap);
    }

    function renderStoryCards() {
      if (!trackEl) return;
      trackEl.textContent = ""; // clear

      // Homepage is a teaser: cap the visible cards, then drive the rest to the
      // gallery via the trailing "View all" card.
      var shown = STORIES.slice(0, MAX_HOME_STORIES);
      shown.forEach(function (s, i) {
        var n = (s.assets || []).length;

        // Cover: image thumbnail when available, else a muted native <video>
        // seeked 2s in (#t=2) for S3 .mp4 stories with no image thumbnail
        // (2s avoids the common black fade-in first frame).
        var cover;
        if (s.coverVideo) {
          cover = el("video", { className: "fdcp-home-story-cover", src: s.coverVideo + "#t=2", muted: "", playsinline: "", preload: "metadata", disablepictureinpicture: "" });
          cover.muted = true;
          cover.disablePictureInPicture = true;
        } else {
          cover = el("img", { className: "fdcp-home-story-cover", src: s.cover || "", alt: "", loading: "lazy" });
        }
        var scrim = el("div", { className: "fdcp-home-story-scrim" });
        var ringLabel = s.eyebrow || "Story";
        var ring  = el("span", {
          className: "fdcp-home-story-ring",
          textContent: ringLabel,
          style: { fontSize: categoryFontSize(ringLabel) }
        });
        var meta  = el("span", { className: "fdcp-home-story-meta", textContent: n + " " + (n === 1 ? "item" : "items") });
        var title = el("span", { className: "fdcp-home-story-title", textContent: s.title || "" });

        var card = el("button", {
          type: "button",
          className: "fdcp-home-story-card",
          "aria-label": "Open story: " + (s.title || "") + " (" + n + " items)",
          dataset: { storyIndex: String(i) }
        }, [cover, scrim, ring, meta, title]);

        card.addEventListener("click", function () { openFocus(i, 0); });

        trackEl.appendChild(card);
      });

      // Trailing CTA card — same footprint as a story card, links to /gallery.
      // Shown whenever there are stories (always points to the full archive).
      if (shown.length) {
        var ctaIcon  = el("span", { className: "fdcp-home-story-cta-icon" }, [svgIcon(SVG_ARROW)]);
        var ctaLabel = el("span", { className: "fdcp-home-story-cta-label", textContent: "View all stories" });
        var ctaSub   = el("span", { className: "fdcp-home-story-cta-sub", textContent: "FDCP Highlights" });
        var cta = el("a", {
          className: "fdcp-home-story-cta",
          href: GALLERY_URL,
          "aria-label": "View all FDCP stories in the gallery"
        }, [ctaIcon, ctaLabel, ctaSub]);
        trackEl.appendChild(cta);
      }

      enableDragScroll(trackEl);
      runEntranceAnimation(trackEl);
    }

    // Click-and-drag horizontal scroll
    function enableDragScroll(track) {
      if (!track || track.__fdcpDragBound) return;
      track.__fdcpDragBound = true;
      var DRAG_THRESHOLD = 8;
      var isDown = false, didDrag = false, startX = 0, startScroll = 0, prevUserSelect = "";
      track.style.cursor = "grab";
      track.style.touchAction = "auto";

      function onMove(e) {
        if (!isDown) return;
        var dx = e.clientX - startX;
        if (!didDrag) {
          if (Math.abs(dx) <= DRAG_THRESHOLD) return;
          didDrag = true;
          track.classList.add("is-dragging");
          track.style.cursor = "grabbing";
        }
        e.preventDefault();
        track.scrollLeft = startScroll - dx;
      }
      function onUp() {
        if (!isDown) return;
        isDown = false;
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        track.classList.remove("is-dragging");
        track.style.cursor = "grab";
        document.body.style.userSelect = prevUserSelect;
        if (didDrag) setTimeout(function () { didDrag = false; }, 0);
      }
      track.addEventListener("pointerdown", function (e) {
        if (e.pointerType !== "mouse") return;
        isDown = true; didDrag = false;
        startX = e.clientX; startScroll = track.scrollLeft;
        prevUserSelect = document.body.style.userSelect;
        document.body.style.userSelect = "none";
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
      track.addEventListener("click", function (e) {
        if (didDrag) { e.preventDefault(); e.stopPropagation(); }
      }, true);

      // Mouse wheel → horizontal scroll. A normal vertical wheel (deltaY) moves
      // the strip sideways; trackpads that already send horizontal deltas (deltaX)
      // pass straight through. Only intercept when there's actually room to scroll
      // horizontally, so the page can still scroll vertically past the strip.
      track.addEventListener("wheel", function (e) {
        var canScrollX = track.scrollWidth > track.clientWidth + 1;
        if (!canScrollX) return;
        // Use whichever axis the user is moving more on.
        var delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        if (!delta) return;
        var atStart = track.scrollLeft <= 0;
        var atEnd   = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1;
        // Let the page take over at the edges so the user isn't trapped.
        if ((delta < 0 && atStart) || (delta > 0 && atEnd)) return;
        e.preventDefault();
        track.scrollLeft += delta;
      }, { passive: false });
    }

    // =====================================================================
    // BUILD MODAL (focus viewer)
    // =====================================================================
    function buildModal() {
      if (modalEl) return;

      refs.close   = el("button", { type: "button", className: "fdcp-home-focus-top-close", "aria-label": "Close stories" }, [svgIcon(SVG_CLOSE)]);

      refs.list    = el("div", { id: "fdcp-home-focus-story-list", className: "fdcp-home-focus-story-list", role: "list" });
      var sidebar  = el("aside", { className: "fdcp-home-focus-sidebar" }, [
        el("h3", { className: "fdcp-home-focus-sidebar-title", textContent: "FDCP Stories" }),
        refs.list
      ]);

      refs.arrowPrev = el("button", { type: "button", className: "fdcp-home-focus-arrow is-prev", "aria-label": "Previous" }, [svgIcon(SVG_PREV)]);
      refs.arrowNext = el("button", { type: "button", className: "fdcp-home-focus-arrow is-next", "aria-label": "Next"     }, [svgIcon(SVG_NEXT)]);

      refs.progress = el("div", { className: "fdcp-home-focus-progress" });
      refs.title    = el("h4",  { className: "fdcp-home-focus-title", textContent: "" });
      refs.counter  = el("span",{ className: "fdcp-home-focus-counter", textContent: "" });
      var header    = el("div", { className: "fdcp-home-focus-header" }, [
        el("div", { className: "fdcp-home-focus-titlewrap" }, [refs.title, refs.counter])
      ]);
      refs.viewport = el("div", { className: "fdcp-home-focus-viewport" });
      refs.tapPrev  = el("button", { type: "button", className: "fdcp-home-focus-tap prev", "aria-label": "Previous" });
      refs.tapNext  = el("button", { type: "button", className: "fdcp-home-focus-tap next", "aria-label": "Next" });
      refs.caption  = el("p",   { className: "fdcp-home-focus-caption" });

      refs.mPrev = el("button", { type: "button", "aria-label": "Previous" }, [svgIcon(SVG_PREV)]);
      refs.mNext = el("button", { type: "button", "aria-label": "Next" }, [svgIcon(SVG_NEXT)]);
      refs.mobileNav = el("div", { className: "fdcp-home-focus-mobilenav", "aria-label": "Story navigation" }, [refs.mPrev, refs.mNext]);

      var frame = el("div", { className: "fdcp-home-focus-frame" }, [
        refs.progress, header, refs.viewport, refs.tapPrev, refs.tapNext, refs.caption, refs.mobileNav
      ]);

      var stage = el("div", { className: "fdcp-home-focus-stage" }, [refs.arrowPrev, frame, refs.arrowNext]);
      var layout = el("div", { className: "fdcp-home-focus-layout" }, [sidebar, stage]);

      modalEl = el("div", {
        id: "fdcp-home-focus",
        role: "dialog",
        "aria-modal": "true",
        "aria-labelledby": ""
      }, [refs.close, layout]);

      // Wire controls
      refs.close.addEventListener("click", closeFocus);
      refs.tapPrev.addEventListener("click", function () { gotoAsset(-1); });
      refs.tapNext.addEventListener("click", function () { gotoAsset(1); });
      refs.arrowPrev.addEventListener("click", function () { gotoAsset(-1); });
      refs.arrowNext.addEventListener("click", function () { gotoAsset(1); });
      refs.mPrev.addEventListener("click", function () { gotoAsset(-1); });
      refs.mNext.addEventListener("click", function () { gotoAsset(1); });
      modalEl.addEventListener("click", function (e) { if (e.target === modalEl) closeFocus(); });

      document.body.appendChild(modalEl);
    }

    // =====================================================================
    // RENDER FOCUS VIEWER PIECES
    // =====================================================================
    function renderProgress() {
      var s = activeStory();
      if (!refs.progress || !s) return;
      refs.progress.textContent = "";
      for (var i = 0; i < s.assets.length; i++) {
        var fill = el("span", { className: "fdcp-home-focus-seg-fill" });
        // Past segments full; current starts empty so the auto-advance ticker
        // can animate it 0→100%; future segments empty.
        if (i < FOCUS.assetIndex) fill.style.width = "100%";
        var seg = el("div", { className: "fdcp-home-focus-seg" }, [fill]);
        refs.progress.appendChild(seg);
      }
    }

    // Signature of the currently-built sidebar list, so we only rebuild its DOM
    // (and re-request the thumbnails) when the story set actually changes — not
    // on every navigation. Rebuilding each time made the circle thumbnails
    // flicker/re-fetch when stepping assets or clicking another story.
    var storyListSig = null;
    function storiesSignature() {
      return STORIES.map(function (s) { return s.id + "|" + (s.assets || []).length; }).join(",");
    }

    // Updates only the active highlight on the existing sidebar items. Cheap and
    // does not touch the <img>/<video> thumbnails, so they stay cached.
    function updateStoryListActive() {
      if (!refs.list) return;
      var items = refs.list.querySelectorAll(".fdcp-home-focus-story-item");
      for (var i = 0; i < items.length; i++) {
        var active = i === FOCUS.storyIndex;
        items[i].classList.toggle("is-active", active);
        var thumb = items[i].querySelector(".fdcp-home-focus-story-thumb");
        if (thumb) thumb.style.borderColor = active ? "#E200A9" : "transparent";
      }
    }

    function renderStoryList() {
      if (!refs.list) return;
      // Already built for this exact story set: just move the highlight so the
      // thumbnails are never re-created (and therefore never re-fetched).
      var sig = storiesSignature();
      if (storyListSig === sig && refs.list.querySelector(".fdcp-home-focus-story-item")) {
        updateStoryListActive();
        return;
      }
      storyListSig = sig;
      refs.list.textContent = "";
      STORIES.forEach(function (s, i) {
        var active = i === FOCUS.storyIndex;
        var n = (s.assets || []).length;

        var thumb;
        if (s.coverVideo) {
          thumb = el("video", {
            className: "fdcp-home-focus-story-thumb",
            src: s.coverVideo + "#t=2", muted: "", playsinline: "", preload: "metadata", disablepictureinpicture: ""
          });
          thumb.muted = true;
          thumb.disablePictureInPicture = true;
        } else {
          thumb = el("img", {
            className: "fdcp-home-focus-story-thumb",
            src: s.cover || "", alt: "", loading: "lazy"
          });
        }
        thumb.style.borderColor = active ? "#E200A9" : "transparent";

        var name = el("span", { className: "fdcp-home-focus-story-name", textContent: s.title || "" });
        var metaSpan = el("span", { className: "fdcp-home-focus-story-meta", textContent: n + " " + (n === 1 ? "item" : "items") });
        var info = el("span", { className: "fdcp-home-focus-story-info" }, [name, metaSpan]);

        var btn = el("button", {
          type: "button",
          className: "fdcp-home-focus-story-item" + (active ? " is-active" : ""),
          dataset: { storyJump: String(i) }
        }, [thumb, info]);

        btn.addEventListener("click", function () {
          if (i === FOCUS.storyIndex) return;
          FOCUS.storyIndex = i;
          FOCUS.assetIndex = 0;
          updateStoryListActive(); renderProgress(); renderHeader(); renderMedia();
        });

        refs.list.appendChild(btn);
      });
    }

    function renderHeader() {
      var s = activeStory();
      if (!s) return;
      // YouTube embeds render their own title overlay inside the player; showing
      // our header title too looks duplicated, so hide ours for those assets.
      var a = activeAsset();
      var isYouTube = !!(a && a.type === "iframe" && /youtube\.com\/embed\//.test(a.src || ""));
      if (refs.title) {
        refs.title.textContent   = s.title || "";
        refs.title.style.display = isYouTube ? "none" : "";
      }
      if (refs.counter) refs.counter.textContent = (FOCUS.assetIndex + 1) + " of " + s.assets.length;
    }

    function renderMedia() {
      var asset = activeAsset();
      if (!refs.viewport || !asset) return;
      destroyActiveHls();   // drop any hls.js instance from the previous asset
      refs.viewport.textContent = "";
      var mediaEl;
      var ytVideoId = "";   // set when this asset is a YouTube (incl. Shorts) embed
      var interactive = (asset.type === "video" || asset.type === "iframe");
      if (asset.type === "video") {
        mediaEl = document.createElement("video");
        // HLS on non-Safari is wired by hls.js after append (setupHlsPlayback) —
        // leave src unset there. Native-HLS browsers + progressive files set it.
        if (!(isHls(asset.src) && !canPlayNativeHls())) {
          mediaEl.src = asset.src;
        }
        mediaEl.controls = true;
        mediaEl.autoplay = true;
        mediaEl.playsInline = true;
        mediaEl.setAttribute("playsinline", "");
        mediaEl.disablePictureInPicture = true;
        mediaEl.setAttribute("disablepictureinpicture", "");
      } else if (asset.type === "iframe" && /youtube\.com\/embed\/([\w-]{11})/.test(asset.src)) {
        // YouTube (incl. Shorts): mount a <div> the IFrame Player API replaces
        // with its iframe, so we get real playback time + an ENDED event for
        // accurate auto-advance (see startYouTubeAutoAdvance).
        ytVideoId = asset.src.match(/youtube\.com\/embed\/([\w-]{11})/)[1];
        mediaEl = document.createElement("div");
      } else if (asset.type === "iframe") {
        var src = asset.src;
        if (/player\.vimeo\.com/.test(src)) {
          src += (src.indexOf("?") >= 0 ? "&" : "?") + "autoplay=1";
        } else if (/drive\.google\.com\/file\/d\/[^/]+\/preview/.test(src)) {
          src += (src.indexOf("?") >= 0 ? "&" : "?") + "autoplay=1";
        }
        mediaEl = document.createElement("iframe");
        mediaEl.src = src;
        mediaEl.setAttribute("allow", "autoplay; encrypted-media; fullscreen");
        mediaEl.setAttribute("allowfullscreen", "");
        mediaEl.style.border = "0";
      } else {
        mediaEl = document.createElement("img");
        mediaEl.src = asset.src;
        mediaEl.alt = asset.caption || (activeStory() && activeStory().title) || "";
      }
      mediaEl.className = "fdcp-home-focus-media";
      refs.viewport.appendChild(mediaEl);
      // HLS (.m3u8) story on a non-Safari browser: attach hls.js + quality gear.
      // Native-HLS browsers already have src set and stream with native ABR.
      if (asset.type === "video" && isHls(asset.src) && !canPlayNativeHls()) {
        setupHlsPlayback(mediaEl, asset.src);
      }
      // Tap zones always navigate prev/next, even over videos/iframes. They only
      // cover the upper part of the frame (see .fdcp-home-focus-tap CSS bottom
      // offset), so the player's bottom control bar stays clickable underneath.
      if (refs.tapPrev) refs.tapPrev.style.pointerEvents = "";
      if (refs.tapNext) refs.tapNext.style.pointerEvents = "";
      // Bottom caption removed — the story title already shows in the header,
      // so the duplicated text at the bottom is suppressed. Hidden outright for
      // YouTube Shorts so it never overlaps the player's own bottom UI.
      if (refs.caption) {
        refs.caption.textContent = "";
        refs.caption.style.display = ytVideoId ? "none" : "";
      }
      syncArrowState();

      // Auto-advance: fill the current bar over the asset's duration, then step
      // to the next asset. Photos use a fixed timer; <video> uses real playback
      // time + the native "ended" event; YouTube (incl. Shorts) uses the IFrame
      // Player API for accurate timing; Vimeo/Drive iframes fall back to a fixed
      // timer (their playback time isn't readable across origins).
      if (asset.type === "video") {
        startVideoAutoAdvance(mediaEl);
      } else if (ytVideoId) {
        startYouTubeAutoAdvance(mediaEl, ytVideoId);
      } else if (asset.type === "iframe") {
        startTimerAutoAdvance(IFRAME_AUTO_MS);
      } else {
        startTimerAutoAdvance(PHOTO_AUTO_MS);
      }
    }

    // HLS PLAYBACK (selectable quality) — mirrors gallery.html. A story video
    // can be a single .m3u8 master that references every rendition. Safari/iOS
    // play it natively (native ABR, no gear). Other browsers get hls.js, lazy-
    // loaded from a CDN on first use and memoized for the session.
    var HLS_CDN = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    var ACTIVE_HLS = null;
    var _hlsPromise = null;

    function canPlayNativeHls() {
      var v = document.createElement("video");
      return !!(v.canPlayType && (
        v.canPlayType("application/vnd.apple.mpegurl") ||
        v.canPlayType("application/x-mpegURL")
      ));
    }

    function ensureHls() {
      if (window.Hls) return Promise.resolve(window.Hls);
      if (_hlsPromise) return _hlsPromise;
      _hlsPromise = new Promise(function (resolve) {
        var s = document.createElement("script");
        s.src = HLS_CDN;
        s.async = true;
        s.onload = function () {
          resolve(window.Hls && window.Hls.isSupported() ? window.Hls : null);
        };
        s.onerror = function () {
          if (window.console) console.warn("[FDCP home stories] hls.js failed to load from CDN");
          _hlsPromise = null;
          resolve(null);
        };
        document.head.appendChild(s);
      });
      return _hlsPromise;
    }

    function destroyActiveHls() {
      if (ACTIVE_HLS) {
        try { ACTIVE_HLS.destroy(); } catch (e) {}
        ACTIVE_HLS = null;
      }
    }

    function setupHlsPlayback(video, url) {
      ensureHls().then(function (Hls) {
        if (!video.isConnected) return;
        if (!Hls) { video.src = url; return; }

        var hls = new Hls({ enableWorker: true });
        ACTIVE_HLS = hls;
        var recovered = false;

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          buildQualityMenu(video, hls, Hls);
          var p = video.play(); if (p && p.catch) p.catch(function () {});
        });

        hls.on(Hls.Events.ERROR, function (evt, data) {
          if (!data || !data.fatal) return;
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered) {
            recovered = true;
            try { hls.recoverMediaError(); return; } catch (e) {}
          }
          if (window.console) console.warn("[FDCP home stories] HLS fatal error", data.type);
          try { hls.destroy(); } catch (e) {}
          if (ACTIVE_HLS === hls) ACTIVE_HLS = null;
        });

        hls.loadSource(url);
        hls.attachMedia(video);
      });
    }

    function buildQualityMenu(video, hls, Hls) {
      var host = video.parentNode;
      if (!host) return;

      var seen = {};
      var heights = [];
      (hls.levels || []).forEach(function (lvl, i) {
        var h = lvl.height || 0;
        if (!h || seen[h] != null) return;
        seen[h] = i;
        heights.push(h);
      });
      heights.sort(function (a, b) { return b - a; });
      if (heights.length < 2) return;

      var GEAR = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "fdcp-home-focus-quality-btn";
      btn.setAttribute("aria-label", "Video quality");
      btn.innerHTML = GEAR;
      btn.style.cssText = "position:absolute;top:14px;right:14px;z-index:6;width:40px;height:40px;"
        + "display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:9999px;"
        + "background:rgba(0,0,0,0.55);color:#fff;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);";

      var menu = document.createElement("div");
      menu.className = "fdcp-home-focus-quality-menu";
      menu.style.cssText = "position:absolute;top:60px;right:14px;z-index:6;display:none;min-width:128px;"
        + "padding:6px;border-radius:12px;background:rgba(20,20,20,0.96);color:#fff;"
        + "box-shadow:0 8px 24px rgba(0,0,0,0.5);font-size:13px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);";

      var rows = [];
      function addRow(label, value, height) {
        var item = document.createElement("button");
        item.type = "button";
        item.textContent = label;
        item.setAttribute("data-level", String(value));
        item.style.cssText = "display:block;width:100%;text-align:left;padding:8px 12px;border:0;border-radius:8px;"
          + "background:transparent;color:#fff;cursor:pointer;font-size:13px;line-height:1.2;white-space:nowrap;";
        item.addEventListener("click", function () {
          hls.currentLevel = value;
          setActive(value);
          closeMenu();
        });
        menu.appendChild(item);
        rows.push({ value: value, height: height, el: item });
      }

      addRow("Auto", -1, null);
      heights.forEach(function (h) { addRow(h + "p", seen[h], h); });

      function setActive(value) {
        rows.forEach(function (r) {
          var on = r.value === value;
          r.el.style.background = on ? "rgba(255,255,255,0.16)" : "transparent";
          r.el.style.fontWeight = on ? "700" : "400";
        });
      }
      function refreshAutoLabel() {
        var autoRow = rows[0];
        if (hls.autoLevelEnabled && hls.currentLevel >= 0 && hls.levels[hls.currentLevel]) {
          autoRow.el.textContent = "Auto (" + hls.levels[hls.currentLevel].height + "p)";
        } else if (hls.autoLevelEnabled) {
          autoRow.el.textContent = "Auto";
        }
      }
      hls.on(Hls.Events.LEVEL_SWITCHED, refreshAutoLabel);

      function openMenu() { menu.style.display = "block"; document.addEventListener("click", onDocClick, true); }
      function closeMenu() { menu.style.display = "none"; document.removeEventListener("click", onDocClick, true); }
      function onDocClick(e) { if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) closeMenu(); }
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (menu.style.display === "block") closeMenu(); else openMenu();
      });

      setActive(-1);
      host.appendChild(btn);
      host.appendChild(menu);
    }

    // AUTO-ADVANCE — see clearAuto()/advanceAuto() below. clearAuto() runs at
    // the start of every start*AutoAdvance and on close, so a stale ticker can
    // never fire after the view changed.
    var PHOTO_AUTO_MS  = 5000;
    var IFRAME_AUTO_MS = 30000;
    var AUTO = { raf: 0, timer: 0, cancel: null };

    function clearAuto() {
      if (AUTO.raf)   { cancelAnimationFrame(AUTO.raf); AUTO.raf = 0; }
      if (AUTO.timer) { clearTimeout(AUTO.timer); AUTO.timer = 0; }
      if (typeof AUTO.cancel === "function") { try { AUTO.cancel(); } catch (e) {} }
      AUTO.cancel = null;
    }

    function currentSegFill() {
      if (!refs.progress) return null;
      var segs = refs.progress.querySelectorAll(".fdcp-home-focus-seg");
      var seg = segs[FOCUS.assetIndex];
      return seg ? seg.querySelector(".fdcp-home-focus-seg-fill") : null;
    }

    function setSegWidth(fill, pct) {
      if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
    }

    function startTimerAutoAdvance(ms) {
      clearAuto();
      var fill = currentSegFill();
      var nowFn = (window.performance && performance.now)
        ? function () { return performance.now(); } : function () { return Date.now(); };
      var start = nowFn();
      function tick() {
        var pct = ((nowFn() - start) / ms) * 100;
        setSegWidth(fill, pct);
        if (pct >= 100) { AUTO.raf = 0; advanceAuto(); return; }
        AUTO.raf = requestAnimationFrame(tick);
      }
      AUTO.raf = requestAnimationFrame(tick);
    }

    function startVideoAutoAdvance(video) {
      clearAuto();
      var fill = currentSegFill();
      function onTime() {
        if (video.duration && isFinite(video.duration)) {
          setSegWidth(fill, (video.currentTime / video.duration) * 100);
        }
      }
      function onEnded() { setSegWidth(fill, 100); advanceAuto(); }
      video.addEventListener("timeupdate", onTime);
      video.addEventListener("ended", onEnded);
      AUTO.cancel = function () {
        video.removeEventListener("timeupdate", onTime);
        video.removeEventListener("ended", onEnded);
      };
    }

    // Loads the YouTube IFrame Player API once (shared across all players) and
    // calls `cb` as soon as YT.Player is available.
    var ytApiState = 0;            // 0 = not loaded, 1 = loading, 2 = ready
    var ytApiQueue = [];
    function loadYouTubeAPI(cb) {
      if (ytApiState === 2) { cb(); return; }
      ytApiQueue.push(cb);
      if (ytApiState === 1) return;
      ytApiState = 1;
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () {
        if (typeof prev === "function") { try { prev(); } catch (e) {} }
        ytApiState = 2;
        var q = ytApiQueue.slice(); ytApiQueue.length = 0;
        q.forEach(function (fn) { try { fn(); } catch (e) {} });
      };
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    // Accurate auto-advance for YouTube (incl. Shorts) via the IFrame Player
    // API: the progress bar tracks real playback time and we advance the moment
    // the player reports ENDED — no more 30s fixed-timer guess. `mountEl` is a
    // <div> the API replaces with its own iframe.
    function startYouTubeAutoAdvance(mountEl, videoId) {
      clearAuto();
      var fill = currentSegFill();
      var player = null, poll = 0, finished = false;
      function stopPoll() { if (poll) { clearInterval(poll); poll = 0; } }
      loadYouTubeAPI(function () {
        if (!window.YT || !YT.Player) { startTimerAutoAdvance(IFRAME_AUTO_MS); return; }
        player = new YT.Player(mountEl, {
          width: "100%", height: "100%", videoId: videoId,
          playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
          events: {
            onReady: function (e) {
              var f = e.target.getIframe && e.target.getIframe();
              if (f) {
                f.className = "fdcp-home-focus-media";
                // Drop picture-in-picture from the player's permissions.
                f.setAttribute("allow", "autoplay; encrypted-media; fullscreen");
              }
              try { e.target.playVideo(); } catch (_) {}
            },
            onStateChange: function (e) {
              if (e.data === YT.PlayerState.PLAYING && !poll) {
                poll = setInterval(function () {
                  if (!player || !player.getDuration) return;
                  var d = player.getDuration() || 0, t = player.getCurrentTime() || 0;
                  if (d) setSegWidth(fill, (t / d) * 100);
                }, 200);
              } else if (e.data === YT.PlayerState.ENDED && !finished) {
                finished = true; stopPoll(); setSegWidth(fill, 100); advanceAuto();
              }
            }
          }
        });
      });
      // Runs on clearAuto() (navigation/close): stop polling and tear the player
      // down so a stale ENDED can't advance after the view changed.
      AUTO.cancel = function () {
        stopPoll();
        if (player && player.destroy) { try { player.destroy(); } catch (_) {} }
        player = null;
      };
    }

    function advanceAuto() {
      clearAuto();
      var s = activeStory();
      if (!s) return;
      var atLastAsset = FOCUS.assetIndex >= s.assets.length - 1;
      var atLastStory = FOCUS.storyIndex >= STORIES.length - 1;
      if (atLastAsset && atLastStory) return;  // end of all stories — stop
      gotoAsset(1);
    }

    function syncArrowState() {
      var s = activeStory();
      if (!s) return;
      var canPrev = FOCUS.assetIndex > 0 || FOCUS.storyIndex > 0;
      var canNext = FOCUS.assetIndex < s.assets.length - 1 || FOCUS.storyIndex < STORIES.length - 1;
      if (refs.arrowPrev) { refs.arrowPrev.disabled = !canPrev; refs.arrowPrev.style.opacity = canPrev ? "1" : "0.25"; }
      if (refs.arrowNext) { refs.arrowNext.disabled = !canNext; refs.arrowNext.style.opacity = canNext ? "1" : "0.25"; }
      if (refs.mPrev) refs.mPrev.disabled = !canPrev;
      if (refs.mNext) refs.mNext.disabled = !canNext;
    }

    function gotoAsset(delta) {
      var s = activeStory();
      if (!s) return;
      var ni = FOCUS.assetIndex + delta;
      if (ni < 0) {
        if (FOCUS.storyIndex > 0) {
          FOCUS.storyIndex -= 1;
          FOCUS.assetIndex = STORIES[FOCUS.storyIndex].assets.length - 1;
        } else return;
      } else if (ni >= s.assets.length) {
        if (FOCUS.storyIndex < STORIES.length - 1) {
          FOCUS.storyIndex += 1;
          FOCUS.assetIndex = 0;
        } else return;
      } else {
        FOCUS.assetIndex = ni;
      }
      updateStoryListActive(); renderProgress(); renderHeader(); renderMedia();
    }

    function openFocus(storyIndex, assetIndex) {
      if (storyIndex < 0 || storyIndex >= STORIES.length) return;
      buildModal();
      FOCUS.storyIndex = storyIndex;
      FOCUS.assetIndex = assetIndex || 0;
      FOCUS.lastFocus = document.activeElement;

      modalEl.classList.add("is-open");
      modalEl.style.display = "flex";
      document.body.style.overflow = "hidden";

      renderStoryList(); renderProgress(); renderHeader(); renderMedia();
      if (refs.close) refs.close.focus();

      FOCUS.keyHandler = function (e) {
        if (e.key === "Escape")    { e.preventDefault(); closeFocus(); }
        if (e.key === "ArrowRight"){ e.preventDefault(); gotoAsset(1); }
        if (e.key === "ArrowLeft") { e.preventDefault(); gotoAsset(-1); }
      };
      document.addEventListener("keydown", FOCUS.keyHandler);
    }

    function closeFocus() {
      if (!modalEl) return;
      modalEl.classList.remove("is-open");
      modalEl.style.display = "none";
      document.body.style.overflow = "";
      clearAuto();
      destroyActiveHls();
      if (refs.viewport) {
        var v = refs.viewport.querySelector("video");
        if (v) { try { v.pause(); } catch (e) {} }
        refs.viewport.textContent = "";
      }
      if (FOCUS.keyHandler) {
        document.removeEventListener("keydown", FOCUS.keyHandler);
        FOCUS.keyHandler = null;
      }
      if (FOCUS.lastFocus && typeof FOCUS.lastFocus.focus === "function") {
        try { FOCUS.lastFocus.focus(); } catch (e) {}
      }
    }

    // =====================================================================
    // GSAP ENTRANCE (optional, no-op if GSAP isn't on the page)
    // =====================================================================
    function runEntranceAnimation(track) {
      if (cardsAnimated) return;
      if (typeof gsap === "undefined" || typeof ScrollTrigger === "undefined") return;
      cardsAnimated = true;
      gsap.registerPlugin(ScrollTrigger);
      var cards = Array.prototype.slice.call(track.querySelectorAll(".fdcp-home-story-card, .fdcp-home-story-cta"));
      if (!cards.length) return;

      // The track is an overflow-x:auto scroller, which also clips the y-axis.
      // A downward y-offset (the "rise up" entrance) gets cropped at the bottom
      // edge while animating. Temporarily pad the bottom so the offset cards stay
      // inside the clip box, then restore once the entrance finishes.
      var OFFSET = 40;
      var prevPadBottom = track.style.paddingBottom;
      track.style.paddingBottom = (14 + OFFSET) + "px";

      gsap.set(cards, { y: OFFSET, opacity: 0 });
      gsap.to(cards, {
        y: 0, opacity: 1, duration: 0.55, stagger: 0.08, ease: "power2.out",
        scrollTrigger: { trigger: track, start: "top 85%", once: true },
        onComplete: function () {
          track.style.paddingBottom = prevPadBottom || "14px";
          gsap.set(cards, { clearProps: "transform" });
        }
      });
    }

    // =====================================================================
    // INIT ng araw
    // =====================================================================
    function init() {
      injectStyles();
      buildSection();
      loadSWR(function (rows) {
        STORIES = parseStoriesSheet(rows);
        renderStoryCards();
      });
      attachFocusRevalidate(function (rows) {
        STORIES = parseStoriesSheet(rows);
        renderStoryCards();
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
