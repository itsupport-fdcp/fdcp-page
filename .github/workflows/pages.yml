# Pages serves the gh-pages branch ("Deploy from a branch" in Settings), so this
# publishes staging/ to that branch's root whenever staging/ changes on main.
#
# It does NOT use actions/deploy-pages: that path needs the Pages source set to
# "GitHub Actions" and a token allowed to create the Pages site, which this repo
# refused. Pushing a branch only needs contents:write, so it just works.
# Site URL: https://itsupport-fdcp.github.io/fdcp-page/
name: Publish staging to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "staging/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push staging/ to gh-pages root
        run: |
          set -euo pipefail
          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          # Rebuild the branch from the current staging/ tree. force-push keeps
          # gh-pages a snapshot of staging/ rather than accumulating history.
          git branch -D gh-pages 2>/dev/null || true
          git subtree split --prefix staging -b gh-pages
          git push --force origin gh-pages
