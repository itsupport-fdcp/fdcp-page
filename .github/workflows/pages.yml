# Publishes staging/ to GitHub Pages. Only that folder is served, so the rest of
# the repo (source pages, scripts, the saved Drupal dump) stays off the site.
# Site URL: https://itsupport-fdcp.github.io/fdcp-page/
name: Deploy staging to Pages

on:
  push:
    branches: [main]
    paths:
      - "staging/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging
      - id: deployment
        uses: actions/deploy-pages@v4
