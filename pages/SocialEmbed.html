

<div id="fdcp-social-embed-root">&nbsp;</div>

<script>
(function () {

  // =====================================================================
  // CONFIG — one entry per Facebook page card. Order = display order.
  // "sub" is the default subtitle; replaced by the live follower count
  // when SOCIAL_STATS_SHEET_URL provides a row whose platform column
  // matches "statsKey".
  // =====================================================================
  var PAGES = [
    { handle: "fdcpofficial", name: "FDCP",     sub: "145K followers", statsKey: "face"     },
    { handle: "juanflixph",   name: "JuanFlix", sub: "@juanflixph",    statsKey: "juanflix" }
  ];

  var FB_FILL_CARD = true;
  var SOCIAL_STATS_SHEET_URL = "";

  // Native size Meta serves the page plugin at (width is capped at 500).
  // FB_NATIVE_H is the height of *visible feed* we want, after cropping.
  var FB_NATIVE_W = 500, FB_NATIVE_H = 520;

  // Meta's small_header bar is a fixed 72px box, but Meta renders ~110px of
  // content into it (avatar + page name + follower line), so the feed below
  // slices the page name in half. No plugin param fixes this. We draw our own
  // header anyway, so crop Meta's off: request a taller iframe and shift it up
  // by exactly this much inside the overflow:hidden body.
  // ponytail: 72 is stable because we always render the iframe at a fixed
  // 500px wide, so the plugin's internal layout never reflows. If Meta
  // restyles the header, this is the one number to re-measure.
  var FB_HEADER_CROP = 72;
  var FB_IFRAME_H = FB_NATIVE_H + FB_HEADER_CROP;

  // =====================================================================
  // STYLES — plain string, injected via createElement (no markup for
  // CKEditor to parse).
  // =====================================================================
  var CSS = [
    ".fdcp-social-wrap{background:transparent;padding:104px 0 64px;font-family:'Poppins','Helvetica Neue',Helvetica,Arial,sans-serif;color:#0d0d0d;}",
    ".fdcp-social-shell{max-width:1120px;margin:0 auto;padding:0 24px;}",
    ".fdcp-social-title{margin:0 0 12px;text-align:center;font-size:clamp(28px,5.5vw,64px);font-weight:800;letter-spacing:-0.01em;color:#0d0d0d;}",
    ".fdcp-social-sub{margin:0 auto 40px;text-align:center;font-size:15px;color:#6b7280;max-width:60ch;}",

    /* Two-up grid: cards sit side by side whenever there's room for two
       340px columns, and stack automatically below that. min(100%,340px)
       prevents horizontal overflow on very narrow phones. */
    ".fdcp-social-stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px;align-items:start;justify-content:center;}",
    ".fdcp-social-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 22px rgba(88,0,118,0.06);transition:box-shadow .25s ease,transform .25s ease;}",
    ".fdcp-social-card:hover{box-shadow:0 10px 32px rgba(88,0,118,0.12);transform:translateY(-2px);}",
    "@media (max-width:768px){.fdcp-social-wrap{padding:72px 0 40px;}.fdcp-social-sub{margin-bottom:28px;}}",

    /* Header */
    ".fdcp-social-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #f1f1f1;background:#fff;}",
    ".fdcp-social-head-left{display:flex;align-items:center;gap:10px;min-width:0;}",
    ".fdcp-social-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 38px;background:#1877F2;}",
    ".fdcp-social-avatar svg{width:19px;height:19px;display:block;color:#fff;}",
    ".fdcp-social-handle{display:flex;flex-direction:column;line-height:1.15;min-width:0;}",
    ".fdcp-social-platform{font-size:14px;font-weight:700;color:#0d0d0d;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}",
    ".fdcp-social-followers{font-size:11px;color:#737373;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}",
    ".fdcp-social-follow{flex:0 0 auto;background:linear-gradient(90deg,#580076 0%,#E200A9 100%);color:#fff;font-size:12px;font-weight:700;letter-spacing:0.02em;padding:7px 16px;border-radius:999px;text-decoration:none;}",
    ".fdcp-social-follow:hover{color:#fff;opacity:0.9;text-decoration:none;}",

    /* Body — Facebook iframe is capped at 500px wide by Meta. To make
       the FB content visually fill the card, we wrap it in a "scaler"
       and apply CSS transform: scale() (sized in JS based on actual card
       width). overflow:hidden keeps any sub-pixel bleed from showing. */
    ".fdcp-social-body{position:relative;flex:none;background:#fff;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;}",
    ".fdcp-fb-scaler{position:relative;}",
    ".fdcp-fb-scaler iframe{display:block;width:" + FB_NATIVE_W + "px;height:" + FB_IFRAME_H + "px;border:0;background:#fff;transform-origin:top left;}",

    /* Footer */
    ".fdcp-social-foot{border-top:1px solid #f1f1f1;padding:13px 16px;background:#fff;display:flex;align-items:center;justify-content:center;}",
    ".fdcp-social-foot-link{font-size:13px;font-weight:600;color:#580076;text-decoration:none;}",
    ".fdcp-social-foot-link:hover{text-decoration:underline;color:#E200A9;}"
  ].join("\n");

  function injectStyles() {
    if (document.getElementById("fdcp-social-embed-styles")) return;
    var s = document.createElement("style");
    s.id = "fdcp-social-embed-styles";
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // =====================================================================
  // ICON SVG — kept as plain string; never written to the page as raw
  // HTML, only parsed into a node via DOMParser/importNode.
  // =====================================================================
  var SVG_FB_GLYPH =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.93.26-1.56 1.6-1.56H17V4.36c-.3-.04-1.34-.13-2.55-.13-2.52 0-4.25 1.54-4.25 4.37v2.2H7.5V14h2.7v8h3.3z"/>' +
    '</svg>';

  // =====================================================================
  // HELPERS
  // =====================================================================
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null) continue;
        if (k === "className")        node.className = v;
        else if (k === "textContent") node.textContent = v;
        else if (k === "style" && typeof v === "object") {
          for (var sk in v) if (Object.prototype.hasOwnProperty.call(v, sk)) node.style[sk] = v[sk];
        }
        else if (k.indexOf("on") === 0 && typeof v === "function") node[k] = v;
        else node.setAttribute(k, v);
      }
    }
    if (children) {
      if (!Array.isArray(children)) children = [children];
      for (var i = 0; i < children.length; i++) {
        var c = children[i];
        if (c == null || c === false) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
    }
    return node;
  }

  function svgIcon(svgString) {
    var doc = new DOMParser().parseFromString(svgString, "image/svg+xml");
    var svg = doc.documentElement;
    return document.importNode(svg, true);
  }

  function isSafeHttpsUrl(s) {
    if (typeof s !== "string") return false;
    var v = s.trim();
    if (!v) return false;
    try {
      var u = new URL(v);
      return u.protocol === "https:";
    } catch (e) { return false; }
  }

  // =====================================================================
  // CARD BUILDERS — each takes a PAGES entry.
  // =====================================================================
  function buildHeader(page) {
    var avatar = el("div", { className: "fdcp-social-avatar" }, [svgIcon(SVG_FB_GLYPH)]);
    var handle = el("div", { className: "fdcp-social-handle" }, [
      el("span", { className: "fdcp-social-platform", textContent: page.name }),
      el("span", {
        id: "fdcp-fb-followers-" + page.handle,
        className: "fdcp-social-followers",
        textContent: page.sub
      })
    ]);
    var left = el("div", { className: "fdcp-social-head-left" }, [avatar, handle]);
    var follow = el("a", {
      className: "fdcp-social-follow",
      href: "https://www.facebook.com/" + page.handle + "/",
      target: "_blank",
      rel: "noopener noreferrer",
      textContent: "Follow"
    });
    return el("div", { className: "fdcp-social-head" }, [left, follow]);
  }

  function buildBody(page) {
    var body = el("div", { className: "fdcp-social-body" });
    var src =
      "https://www.facebook.com/plugins/page.php?href=" +
      encodeURIComponent("https://www.facebook.com/" + page.handle) +
      "&tabs=timeline&width=" + FB_NATIVE_W + "&height=" + FB_IFRAME_H +
      "&small_header=true&adapt_container_width=true&hide_cover=false&show_facepile=false";
    var iframe = el("iframe", {
      src: src,
      title: "Facebook timeline for " + page.name,
      loading: "lazy",
      allow: "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share",
      allowfullscreen: "true",
      scrolling: "no",
      frameborder: "0",
      width: String(FB_NATIVE_W),
      height: String(FB_IFRAME_H)
    });
    var scaler = el("div", { className: "fdcp-fb-scaler" }, [iframe]);
    body.appendChild(scaler);
    return body;
  }

  // Resize each FB iframe via CSS transform so its visual width fills its
  // own card, and shift it up so Meta's broken header is cropped away.
  // Scale is computed per card from the body's actual width on every resize,
  // so side-by-side and stacked layouts both stay correct.
  //
  // transform-origin is top left and the list applies right-to-left, so
  // "scale(s) translateY(-crop)" maps iframe y -> (y - crop) * s: the feed's
  // top lands exactly at the body's top, and the visible height is
  // FB_NATIVE_H * s (the crop is already excluded).
  function fitFBEmbeds() {
    var scalers = document.querySelectorAll(".fdcp-fb-scaler");
    for (var i = 0; i < scalers.length; i++) {
      var scaler = scalers[i];
      var body = scaler.parentElement;
      if (!body) continue;
      var cs = (window.getComputedStyle ? getComputedStyle(body) : null);
      var padL = cs ? parseFloat(cs.paddingLeft)  || 0 : 0;
      var padR = cs ? parseFloat(cs.paddingRight) || 0 : 0;
      var available = body.clientWidth - padL - padR;
      // Never scale past 1 — the plugin is capped at 500px wide by Meta and
      // upscaling only blurs it.
      var scale = FB_FILL_CARD ? Math.min(1, available / FB_NATIVE_W) : 1;
      var iframe = scaler.firstElementChild;
      if (iframe) {
        iframe.style.transform =
          "scale(" + scale + ") translateY(-" + FB_HEADER_CROP + "px)";
      }
      scaler.style.width  = (FB_NATIVE_W * scale) + "px";
      scaler.style.height = (FB_NATIVE_H * scale) + "px";
      body.style.height   = (FB_NATIVE_H * scale) + "px";
    }
  }

  function buildFooter(page) {
    var viewMore = el("a", {
      className: "fdcp-social-foot-link",
      href: "https://www.facebook.com/" + page.handle + "/",
      target: "_blank",
      rel: "noopener noreferrer",
      textContent: "View More on Facebook"
    });
    return el("div", { className: "fdcp-social-foot" }, [viewMore]);
  }


  function parseGvizRows(text) {
    try {
      var doc = new DOMParser().parseFromString(text, "text/html");
      var table = doc.querySelector("table");
      if (!table || !table.rows.length) return [];
      var headers = [];
      for (var h = 0; h < table.rows[0].cells.length; h++) {
        headers.push((table.rows[0].cells[h].textContent || "").trim());
      }
      var out = [];
      for (var i = 1; i < table.rows.length; i++) {
        var cells = table.rows[i].cells, obj = {};
        for (var j = 0; j < headers.length; j++) {
          obj[headers[j]] = cells[j] ? (cells[j].textContent || "").trim() : "";
        }
        out.push(obj);
      }
      return out;
    } catch (e) { return []; }
  }

  function applyFollowerCount(elementId, count) {
    var n = document.getElementById(elementId);
    if (!n || !count) return;
    var clean = String(count).replace(/\s*followers?\s*$/i, "").trim();
    if (!clean) return;
    n.textContent = clean + " followers";
  }

  function fetchSocialStats() {
    if (!isSafeHttpsUrl(SOCIAL_STATS_SHEET_URL)) return;
    fetch(SOCIAL_STATS_SHEET_URL + "&_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (txt) {
        var rows = parseGvizRows(txt);
        rows.forEach(function (r) {
          var keys = Object.keys(r);
          var platform  = (r[keys[0]] || "").toLowerCase();
          var followers = (r[keys[1]] || "").trim();
          if (!platform || !followers) return;
          // Most specific statsKey wins (e.g. "juanflix" row must not be
          // eaten by a broader "face" match), so check longer keys first.
          var pages = PAGES.slice().sort(function (a, b) { return b.statsKey.length - a.statsKey.length; });
          for (var i = 0; i < pages.length; i++) {
            if (platform.indexOf(pages[i].statsKey) !== -1) {
              applyFollowerCount("fdcp-fb-followers-" + pages[i].handle, followers);
              return;
            }
          }
        });
      })
      .catch(function () { /* keep the hardcoded default */ });
  }

  // =====================================================================
  // MOUNT
  // =====================================================================
  function mount() {
    injectStyles();

    var root = document.getElementById("fdcp-social-embed-root");
    if (!root) {
      // Drupal sometimes strips empty mount divs. Recreate next to this
      // script so the block still renders.
      root = document.createElement("div");
      root.id = "fdcp-social-embed-root";
      var scripts = document.getElementsByTagName("script");
      var here = scripts[scripts.length - 1];
      if (here && here.parentNode) here.parentNode.insertBefore(root, here);
      else document.body.appendChild(root);
    }
    root.textContent = ""; // clear &nbsp; placeholder

    var title = el("h2", { className: "fdcp-social-title", textContent: "Social Updates" });
    var sub = el("p", {
      className: "fdcp-social-sub",
      textContent: "The latest from FDCP and JuanFlix on Facebook."
    });

    var cards = [];
    for (var i = 0; i < PAGES.length; i++) {
      cards.push(el("div", { className: "fdcp-social-card" }, [
        buildHeader(PAGES[i]),
        buildBody(PAGES[i]),
        buildFooter(PAGES[i])
      ]));
    }

    var stage = el("div", { className: "fdcp-social-stage" }, cards);
    var shell = el("div", { className: "fdcp-social-shell" }, [title, sub, stage]);
    var wrap  = el("div", {
      className: "fdcp-social-wrap",
      role: "region",
      "aria-label": "Latest social updates from FDCP and JuanFlix"
    }, [shell]);

    root.appendChild(wrap);

    // Size each FB iframe to fill its card width; rerun on resize so the
    // scale stays correct across breakpoints.
    fitFBEmbeds();
    var resizeT = null;
    window.addEventListener("resize", function () {
      if (resizeT) clearTimeout(resizeT);
      resizeT = setTimeout(fitFBEmbeds, 120);
    });

    // Kick off the optional dynamic follower-count fetch.
    fetchSocialStats();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
})();
</script>
